plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hawk.remote'
    compileSdk 33

    defaultConfig {
        applicationId "com.hawk.remote"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
